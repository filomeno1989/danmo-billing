<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Danmo SS — Técnicos</title>
<link rel="stylesheet" href="style.css">

<style>
.nav-dropdown { position:relative; }
.nav-dropdown-btn {
  background:transparent; border:none; color:var(--steel);
  padding:8px 16px; cursor:pointer; font-family:'Source Sans 3';
  font-size:13px; letter-spacing:1px; text-transform:uppercase;
  border-radius:4px; transition:all 0.2s;
  display:inline-flex; align-items:center; gap:6px;
}
.nav-dropdown-btn:hover, .nav-dropdown-btn.open {
  background:rgba(245,158,11,0.15); color:var(--amber);
}
.nav-dropdown-menu {
  position:absolute; top:calc(100% + 8px); left:0;
  background:var(--navy2); border:1px solid var(--border);
  border-radius:8px; min-width:220px; z-index:999;
  box-shadow:0 8px 32px rgba(0,0,0,0.5);
  padding:6px; display:none;
}
.nav-dropdown-menu.open { display:block; }
.nav-dropdown-item {
  display:flex; align-items:center; gap:10px;
  padding:9px 12px; border-radius:5px; cursor:pointer;
  color:var(--steel); font-size:13px; text-decoration:none;
  transition:all 0.2s; white-space:nowrap;
}
.nav-dropdown-item:hover { background:rgba(245,158,11,0.12); color:var(--amber); }
.nav-dropdown-item.active { color:var(--amber); font-weight:600; }
.nav-divider { height:1px; background:var(--border); margin:4px 0; }
.nav-home-btn {
  background:transparent; border:none; color:var(--steel);
  padding:8px 16px; cursor:pointer; font-family:'Source Sans 3';
  font-size:13px; letter-spacing:1px; text-transform:uppercase;
  border-radius:4px; transition:all 0.2s; text-decoration:none;
  display:inline-flex; align-items:center; gap:6px;
}
.nav-home-btn:hover, .nav-home-btn.active {
  background:rgba(245,158,11,0.15); color:var(--amber);
}
</style>

</head>
<body>

<header class="app-header">
  <a href="dashboard.html" class="logo">
    <div class="logo-icon">DS</div>
    <div><div class="logo-text">Danmo SS</div><div class="logo-sub">Cotações &amp; Faturas</div></div>
  </a>
  <nav class="header-nav" id="main-nav"></nav>
  <div class="user-info">
    <div><div class="user-name" id="user-nome"></div><div class="user-nivel" id="user-nivel-badge"></div></div>
    <button id="btn-tema-header" onclick="togglePainelTemas()" style="background:transparent;border:1px solid var(--border);color:var(--steel);padding:6px 10px;border-radius:5px;cursor:pointer;font-size:14px;margin-right:6px;transition:all 0.2s;" title="Aparência" onmouseover="this.style.borderColor='var(--amber)';this.style.color='var(--amber)'" onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--steel)'">🎨</button><button class="btn-logout" onclick="auth.logout()">Sair</button>
  </div>
</header>

<div class="modal-overlay" id="modal-tecnico">
  <div class="modal modal-md">
    <div class="modal-title" id="modal-titulo">👷 Novo Técnico</div>
    <input type="hidden" id="tec-id">
    <div class="grid-2">
      <div class="form-row"><label>Nome *</label><input type="text" id="tec-nome" placeholder="Nome do técnico ou categoria"></div>
      <div class="form-row"><label>Especialidade</label><input type="text" id="tec-esp" placeholder="ex: Mecânico, Eletricista..."></div>
    </div>
    <div class="grid-2">
      <div class="form-row"><label>Tarifa / Hora (MZN)</label><input type="number" id="tec-mzn" step="0.01" placeholder="0.00"></div>
      <div class="form-row"><label>Tarifa / Hora (USD)</label><input type="number" id="tec-usd" step="0.01" placeholder="0.00"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="fecharModal('modal-tecnico')">Cancelar</button>
      <button class="btn btn-primary" onclick="guardar()">💾 Guardar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-confirm">
  <div class="modal modal-sm">
    <div class="modal-title">⚠️ Confirmar</div>
    <p id="confirm-msg"></p>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="fecharModal('modal-confirm')">Cancelar</button>
      <button class="btn btn-danger" id="confirm-ok-btn">Eliminar</button>
    </div>
  </div>
</div>

<div class="page-body">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;flex-wrap:wrap;gap:10px;">
    <h1 class="page-title" style="margin:0;">👷 <span>Técnicos</span></h1>
    <button class="btn btn-primary" id="btn-novo" onclick="abrirNovo()" style="display:none;">➕ Novo Técnico</button>
  </div>
  <div class="card">
    <div id="tabela-wrap"><div class="loading"><span class="spinner"></span> A carregar...</div></div>
  </div>
</div>

<script src="tema.js"></script>
<script src="supabase.js"></script><script src="auth.js"></script><script src="utils.js"></script>
<script>
const user = auth.require();
let lista = [];

if (!auth.isAdmin()) window.location.href = 'dashboard.html';
document.getElementById('user-nome').textContent = user.nome;
const nb = document.getElementById('user-nivel-badge');
nb.textContent = user.nivel.charAt(0).toUpperCase() + user.nivel.slice(1);
nb.className = `user-nivel nivel-${user.nivel}`;
document.getElementById('btn-novo').style.display = 'inline-flex';

buildNav(); carregar();


function buildNav() {
  const nav = document.getElementById('main-nav');
  nav.innerHTML = '';

  // HOME button
  const home = document.createElement('a');
  home.href = 'dashboard.html';
  home.className = 'nav-home-btn';
  home.innerHTML = '🏠 Início';
  nav.appendChild(home);

  // SERVIÇOS dropdown — not for operador
  if (!auth.isGestor()) return;

  const adminItems = [
    { href:'editor.html',       id:'editor',       icon:'➕', label:'Novo Documento' },
    null,
    { href:'clientes.html',     id:'clientes',     icon:'🏢', label:'Clientes' },
    { href:'tecnicos.html',     id:'tecnicos',     icon:'👷', label:'Técnicos' },
    { href:'materiais.html',    id:'materiais',    icon:'📦', label:'Materiais' },
    { href:'tarifas.html',      id:'tarifas',      icon:'💰', label:'Tarifas' },
    null,
    { href:'utilizadores.html', id:'utilizadores', icon:'👤', label:'Utilizadores' },
    { href:'relatorios.html',   id:'relatorios',   icon:'📊', label:'Relatórios' },
  ];

  const gestorItems = [
    { href:'editor.html',    id:'editor',    icon:'➕', label:'Novo Documento' },
    null,
    { href:'clientes.html',  id:'clientes',  icon:'🏢', label:'Clientes' },
    { href:'materiais.html', id:'materiais', icon:'📦', label:'Materiais' },
    { href:'relatorios.html',id:'relatorios',icon:'📊', label:'Relatórios' },
  ];

  const items = auth.isAdmin() ? adminItems : gestorItems;
  const activeId = 'tecnicos';

  // Build dropdown
  const wrap = document.createElement('div');
  wrap.className = 'nav-dropdown';

  const btn = document.createElement('button');
  btn.className = 'nav-dropdown-btn';
  btn.id = 'nav-servicos-btn';
  const isServiceActive = activeId !== 'dashboard';
  btn.innerHTML = `⚙️ Serviços ${isServiceActive ? '●' : '▾'}`;
  if (isServiceActive) btn.style.color = 'var(--amber)';
  btn.onclick = (e) => { e.stopPropagation(); toggleDropdown(); };

  const menu = document.createElement('div');
  menu.className = 'nav-dropdown-menu';
  menu.id = 'nav-servicos-menu';

  items.forEach(item => {
    if (!item) {
      const div = document.createElement('div');
      div.className = 'nav-divider';
      menu.appendChild(div);
      return;
    }
    const a = document.createElement('a');
    a.href = item.href;
    a.className = 'nav-dropdown-item' + (item.id === activeId ? ' active' : '');
    a.innerHTML = `<span>${item.icon}</span><span>${item.label}</span>`;
    menu.appendChild(a);
  });

  wrap.appendChild(btn);
  wrap.appendChild(menu);
  nav.appendChild(wrap);

  // Close on outside click
  document.addEventListener('click', () => {
    menu.classList.remove('open');
    btn.classList.remove('open');
  });
}

function toggleDropdown() {
  const menu = document.getElementById('nav-servicos-menu');
  const btn  = document.getElementById('nav-servicos-btn');
  menu.classList.toggle('open');
  btn.classList.toggle('open');
}


async function carregar() {
  try {
    lista = await db.get('tecnicos');
    lista.sort((a,b) => a.nome.localeCompare(b.nome));
    render();
  } catch(err) {
    document.getElementById('tabela-wrap').innerHTML = `<div class="empty-state"><span class="empty-icon">⚠️</span>Erro ao carregar.</div>`;
  }
}

function render() {
  const wrap = document.getElementById('tabela-wrap');
  if (!lista.length) {
    wrap.innerHTML = `<div class="empty-state"><span class="empty-icon">👷</span>Nenhum técnico registado.<br><button class="btn btn-primary" style="margin-top:1rem;" onclick="abrirNovo()">➕ Adicionar técnico</button></div>`;
    return;
  }
  wrap.innerHTML = `
    <div style="font-size:12px;color:var(--steel2);margin-bottom:10px;">${lista.length} técnico(s)</div>
    <div class="table-wrap"><table>
      <thead><tr><th>Nome</th><th>Especialidade</th><th>Tarifa/Hora MZN</th><th>Tarifa/Hora USD</th><th style="width:100px;">Ações</th></tr></thead>
      <tbody>${lista.map(t=>`<tr>
        <td><strong>${t.nome}</strong></td>
        <td style="color:var(--steel);font-size:13px;">${t.especialidade||'—'}</td>
        <td style="font-family:'Courier Prime';">${fmtNum(t.tarifa_mzn||0)} MZN</td>
        <td style="font-family:'Courier Prime';">${fmtNum(t.tarifa_usd||0)} USD</td>
        <td><div style="display:flex;gap:4px;">
          <button class="btn btn-outline btn-xs" onclick="abrirEditar('${t.id}')">✏️</button>
          <button class="btn btn-danger btn-xs" onclick="eliminar('${t.id}','${t.nome.replace(/'/g,"\\'")}')">🗑️</button>
        </div></td>
      </tr>`).join('')}</tbody>
    </table></div>`;
}

function abrirNovo() {
  document.getElementById('modal-titulo').textContent = '👷 Novo Técnico';
  ['tec-id','tec-nome','tec-esp','tec-mzn','tec-usd'].forEach(id => setVal(id,''));
  abrirModal('modal-tecnico');
}

function abrirEditar(id) {
  const t = lista.find(x=>x.id===id); if(!t) return;
  document.getElementById('modal-titulo').textContent = '✏️ Editar Técnico';
  setVal('tec-id',t.id); setVal('tec-nome',t.nome||''); setVal('tec-esp',t.especialidade||'');
  setVal('tec-mzn',t.tarifa_mzn||''); setVal('tec-usd',t.tarifa_usd||'');
  abrirModal('modal-tecnico');
}

async function guardar() {
  const nome = getVal('tec-nome').trim();
  if (!nome) { showToast('Nome obrigatório.','error'); return; }
  const dados = { nome, especialidade:getVal('tec-esp'), tarifa_mzn:parseFloat(getVal('tec-mzn'))||0, tarifa_usd:parseFloat(getVal('tec-usd'))||0 };
  try {
    const id = getVal('tec-id');
    if (id) {
      await db.update('tecnicos',id,dados);
      const idx = lista.findIndex(t=>t.id===id);
      if(idx>=0) lista[idx]={...lista[idx],...dados};
      showToast('Técnico actualizado!');
    } else {
      const res = await db.insert('tecnicos',dados);
      lista.push(res[0]); lista.sort((a,b)=>a.nome.localeCompare(b.nome));
      showToast('Técnico adicionado!');
    }
    fecharModal('modal-tecnico'); render();
  } catch(err) { showToast('Erro ao guardar.','error'); console.error(err); }
}

function eliminar(id, nome) {
  confirmar(`Eliminar técnico "${nome}"?`, async () => {
    try {
      await db.delete('tecnicos',id);
      lista = lista.filter(t=>t.id!==id); render();
      showToast('Técnico eliminado.');
    } catch(err) { showToast('Erro ao eliminar.','error'); }
  });
}

window.addEventListener('click', e => { if(e.target.classList.contains('modal-overlay')) e.target.classList.remove('open'); });
</script>
</body>
</html>
