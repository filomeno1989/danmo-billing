<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danmo SS — Relatórios</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .rel-tabs {
      display: flex; gap: 4px; margin-bottom: 1.5rem;
      background: rgba(255, 255, 255, 0.04); border-radius: 8px; padding: 4px;
    }
    .rel-tab {
      flex: 1; padding: 10px; border: none; border-radius: 6px;
      cursor: pointer; font-family: 'Source Sans 3'; font-size: 13px;
      font-weight: 600; letter-spacing: 0.5px; color: var(--steel);
      background: transparent; transition: all 0.2s; text-align: center;
    }
    .rel-tab.active { background: var(--amber); color: var(--navy); }
    .rel-tab:hover:not(.active) { color: var(--amber); }
    .rel-panel { display: none; }
    .rel-panel.active { display: block; }
    .filtros-bar {
      display: flex; gap: 12px; align-items: flex-end;
      flex-wrap: wrap; margin-bottom: 1.5rem;
    }
    .filtros-bar .form-row { margin: 0; }
    .filtros-bar label { font-size: 10px; }
    .filtros-bar input,
    .filtros-bar select { padding: 8px 12px; font-size: 13px; }
    .kpi-mini-grid {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 1rem; margin-bottom: 1.5rem;
    }
    .kpi-mini {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 8px; padding: 1rem; text-align: center;
    }
    .kpi-mini-val {
      font-family: 'Bebas Neue'; font-size: 28px; color: var(--amber);
      line-height: 1; margin-bottom: 4px;
    }
    .kpi-mini-label {
      font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--steel);
    }
    .resultado-vazio {
      text-align: center; padding: 3rem; color: var(--steel2); font-size: 14px;
    }
    
    /* Print */
    @media print {
      body { background: white; }
      .app-header, .rel-tabs, .filtros-bar, .btn-imprimir,
      .no-print { display: none !important; }
      .page-body { padding: 0; max-width: 100%; }
      .card { border: none; box-shadow: none; background: white; }
      table { font-size: 11pt; color: #000; }
      th { background: #0a1628 !important; color: white !important; -webkit-print-color-adjust: exact; }
      .kpi-mini { border: 1px solid #ddd; background: white; }
      .kpi-mini-val { color: #0a1628; }
      .print-header { display: block !important; }
    }
    
    .print-header {
      display: none; text-align: center; margin-bottom: 20px;
      font-family: 'Times New Roman', serif;
    }
    .print-header h2 { font-size: 18pt; color: #0a1628; }
    .print-header p { font-size: 11pt; color: #555; margin-top: 4px; }
  </style>
</head>
<body>

<header class="app-header">
  <a href="dashboard.html" class="logo">
    <div class="logo-icon">DS</div>
    <div>
      <div class="logo-text">Danmo SS</div>
      <div class="logo-sub">Cotações &amp; Faturas</div>
    </div>
  </a>
  <nav class="header-nav" id="main-nav"></nav>
  <div class="user-info">
    <div>
      <div class="user-name" id="user-nome"></div>
      <div class="user-nivel" id="user-nivel-badge"></div>
    </div>
    <button id="btn-tema-header" onclick="togglePainelTemas()" style="background:transparent;border:1px solid var(--border);color:var(--steel);padding:6px 10px;border-radius:5px;cursor:pointer;font-size:14px;margin-right:6px;">🎨</button>
    <button class="btn-logout" onclick="auth.logout()">Sair</button>
  </div>
</header>

<div class="page-body">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;flex-wrap:wrap;gap:10px;">
    <h1 class="page-title" style="margin:0;">📊 <span>Relatórios</span></h1>
    <button class="btn btn-outline btn-imprimir" onclick="window.print()">🖨️ Imprimir Relatório</button>
  </div>

  <div class="rel-tabs no-print">
    <button class="rel-tab active" onclick="mudarTab('periodo',this)">📅 Por Período</button>
    <button class="rel-tab" onclick="mudarTab('cliente',this)">🏢 Por Cliente</button>
    <button class="rel-tab" onclick="mudarTab('utilizador',this)">👤 Por Utilizador</button>
  </div>

  <div class="rel-panel active" id="panel-periodo">
    <div class="print-header">
      <h2>Danmo Service System, Lda</h2>
      <p id="print-titulo-periodo">Relatório por Período</p>
    </div>
    <div class="card no-print">
      <div class="filtros-bar">
        <div class="form-row">
          <label>De</label>
          <input type="date" id="per-de" style="width:150px;">
        </div>
        <div class="form-row">
          <label>Até</label>
          <input type="date" id="per-ate" style="width:150px;">
        </div>
        <div class="form-row">
          <label>Tipo</label>
          <select id="per-tipo" style="width:150px;">
            <option value="">Todos</option>
            <option value="cotacao">Cotações</option>
            <option value="fatura">Faturas</option>
          </select>
        </div>
        <button class="btn btn-primary" onclick="gerarPeriodo()">🔍 Gerar</button>
      </div>
    </div>
    <div id="resultado-periodo"></div>
  </div>

  <div class="rel-panel" id="panel-cliente">
    <div class="print-header">
      <h2>Danmo Service System, Lda</h2>
      <p id="print-titulo-cliente">Relatório por Cliente</p>
    </div>
    <div class="card no-print">
      <div class="filtros-bar">
        <div class="form-row" style="flex:1;min-width:200px;">
          <label>Cliente</label>          <select id="cli-sel" style="width:100%;">
            <option value="">— Selecionar cliente —</option>
          </select>
        </div>
        <div class="form-row">
          <label>Tipo</label>
          <select id="cli-tipo" style="width:150px;">
            <option value="">Todos</option>
            <option value="cotacao">Cotações</option>
            <option value="fatura">Faturas</option>
          </select>
        </div>
        <button class="btn btn-primary" onclick="gerarCliente()">🔍 Gerar</button>
      </div>
    </div>
    <div id="resultado-cliente"></div>
  </div>

  <div class="rel-panel" id="panel-utilizador">
    <div class="print-header">
      <h2>Danmo Service System, Lda</h2>
      <p id="print-titulo-utilizador">Relatório por Utilizador</p>
    </div>
    <div class="card no-print">
      <div class="filtros-bar">
        <div class="form-row">
          <label>De</label>
          <input type="date" id="util-de" style="width:150px;">
        </div>
        <div class="form-row">
          <label>Até</label>
          <input type="date" id="util-ate" style="width:150px;">
        </div>
        <button class="btn btn-primary" onclick="gerarUtilizador()">🔍 Gerar</button>
      </div>
    </div>
    <div id="resultado-utilizador"></div>
  </div>
</div>

<script src="tema.js"></script>
<script src="supabase.js"></script>
<script src="auth.js"></script>
<script src="utils.js"></script>
<script>
const user = auth.require();
let clientes = [], documentos = [];

if (!auth.isGestor()) window.location.href = 'dashboard.html';

document.getElementById('user-nome').textContent = user.nome;
const nb = document.getElementById('user-nivel-badge');
nb.textContent = user.nivel.charAt(0).toUpperCase() + user.nivel.slice(1);
nb.className = `user-nivel nivel-${user.nivel}`;

buildNav(); 
iniciar();

function buildNav() {
  const menus = {
    admin: [
      { label:'📋 Dashboard',    href:'dashboard.html' },
      { label:'➕ Novo',         href:'editor.html' },
      { label:'🏢 Clientes',     href:'clientes.html' },
      { label:'👷 Técnicos',     href:'tecnicos.html' },
      { label:'📦 Materiais',    href:'materiais.html' },
      { label:'💰 Tarifas',      href:'tarifas.html' },
      { label:'👤 Utilizadores', href:'utilizadores.html' },
      { label:'📊 Relatórios',   href:'relatorios.html' },
    ],
    gestor: [
      { label:'📋 Dashboard',  href:'dashboard.html' },
      { label:'➕ Novo',       href:'editor.html' },
      { label:'🏢 Clientes',   href:'clientes.html' },
      { label:'📦 Materiais',  href:'materiais.html' },
      { label:'📊 Relatórios', href:'relatorios.html' },
    ],
    operador: [{ label:'📋 Dashboard', href:'dashboard.html' }]
  };
  
  const nav = document.getElementById('main-nav');
  (menus[user.nivel]||menus.operador).forEach(item => {
    const a = document.createElement('a');
    a.href = item.href; a.textContent = item.label;
    a.className = 'nav-btn' + (item.href==='relatorios.html'?' active':'');
    nav.appendChild(a);
  });
}

async function iniciar() {
  // Datas padrão — mês actual
  const agora = new Date();
  const ini   = new Date(agora.getFullYear(), agora.getMonth(), 1).toISOString().split('T')[0];
  const fim   = agora.toISOString().split('T')[0];
  
  document.getElementById('per-de').value   = ini;
  document.getElementById('per-ate').value  = fim;
  document.getElementById('util-de').value  = ini;
  document.getElementById('util-ate').value = fim;
  
  try {
    [clientes, documentos] = await Promise.all([
      db.get('clientes'),
      db.get('documentos')
    ]);
    
    // Popular select de clientes
    const sel = document.getElementById('cli-sel');
    // Clientes que têm documentos
    const clientesComDocs = [...new Set(documentos.map(d => d.cliente_nome).filter(Boolean))].sort();
    clientesComDocs.forEach(nome => {
      const opt = document.createElement('option');
      opt.value = nome; opt.textContent = nome;
      sel.appendChild(opt);
    });
  } catch(err) { console.error(err); }
}

// ── TABS ──────────────────────────────────────────────
function mudarTab(tab, btn) {
  document.querySelectorAll('.rel-tab').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.rel-panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('panel-' + tab).classList.add('active');
}

// ── RELATÓRIO 1: PERÍODO ──────────────────────────────
function gerarPeriodo() {
  const de   = document.getElementById('per-de').value;
  const ate  = document.getElementById('per-ate').value;
  const tipo = document.getElementById('per-tipo').value;
  
  if (!de || !ate) { alert('Selecciona o período.'); return; }
  
  let docs = documentos.filter(d => d.data >= de && d.data <= ate);
  if (tipo) docs = docs.filter(d => d.tipo === tipo);
  docs.sort((a,b) => a.data.localeCompare(b.data));
  
  const totalMZN   = docs.reduce((s,d) => s + (d.total_mzn||0), 0);
  const totalCot   = docs.filter(d => d.tipo==='cotacao').length;
  const totalFat   = docs.filter(d => d.tipo==='fatura').length;
  
  // Atualizar print titulo
  document.getElementById('print-titulo-periodo').textContent = 
    `Período: ${fmtData(de)} a ${fmtData(ate)}${tipo ? ' · ' + (tipo==='cotacao'?'Cotações':'Faturas') : ''}`;
    
  const wrap = document.getElementById('resultado-periodo');
  if (!docs.length) {
    wrap.innerHTML = `<div class="resultado-vazio">Nenhum documento encontrado neste período.</div>`;
    return;
  }
  
  wrap.innerHTML = `
    <div class="kpi-mini-grid" style="margin-bottom:1.5rem;">
      <div class="kpi-mini">
        <div class="kpi-mini-val">${docs.length}</div>
        <div class="kpi-mini-label">Total Documentos</div>
      </div>
      <div class="kpi-mini">
        <div class="kpi-mini-val">${totalCot}</div>
        <div class="kpi-mini-label">Cotações</div>
      </div>
      <div class="kpi-mini">
        <div class="kpi-mini-val">${totalFat}</div>
        <div class="kpi-mini-label">Faturas</div>
      </div>
      <div class="kpi-mini">
        <div class="kpi-mini-val" style="font-size:20px;">${fmtNum(totalMZN)}</div>
        <div class="kpi-mini-label">Total MZN</div>
      </div>
    </div>
    <div class="card">
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Nº</th><th>Tipo</th><th>Data</th><th>Cliente</th>
            <th>Serviço</th><th>Total</th><th>Elaborado por</th>
          </tr></thead>
          <tbody>
            ${docs.map(d=>`<tr>
              <td style="font-family:'Courier Prime';color:var(--amber);font-weight:700;">${d.numero||'—'}</td>
              <td><span class="badge badge-${d.tipo}">${d.tipo==='cotacao'?'Cotação':'Fatura'}</span></td>
              <td style="color:var(--steel);font-size:13px;">${fmtData(d.data)}</td>
              <td>${d.cliente_nome||'—'}</td>
              <td><span class="badge badge-${d.servico||'mao'}" style="font-size:10px;">${d.servico==='mao'?'Mão-de-Obra':d.servico==='material'?'Material':'Misto'}</span></td>
              <td style="font-family:'Courier Prime';">${fmtNum(d.total)} ${d.moeda}</td>
              <td style="font-size:13px;color:var(--steel);">${d.utilizador_nome||'—'}</td>
            </tr>`).join('')}
          </tbody>
          <tfoot>
            <tr style="border-top:2px solid var(--border);">
              <td colspan="5" style="font-weight:700;padding:12px;">TOTAL PERÍODO</td>
              <td style="font-family:'Courier Prime';font-weight:700;color:var(--amber);font-size:15px;">${fmtNum(totalMZN)} MZN</td>
              <td></td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>`;
}

// ── RELATÓRIO 2: CLIENTE ──────────────────────────────
function gerarCliente() {
  const clienteNome = document.getElementById('cli-sel').value;
  const tipo        = document.getElementById('cli-tipo').value;
  
  if (!clienteNome) { alert('Selecciona um cliente.'); return; }
  
  let docs = documentos.filter(d => d.cliente_nome === clienteNome);
  if (tipo) docs = docs.filter(d => d.tipo === tipo);
  docs.sort((a,b) => b.data.localeCompare(a.data));
  
  const totalMZN = docs.reduce((s,d) => s + (d.total_mzn||0), 0);
  const totalCot = docs.filter(d => d.tipo==='cotacao').length;
  const totalFat = docs.filter(d => d.tipo==='fatura').length;
  
  document.getElementById('print-titulo-cliente').textContent = 
    `Cliente: ${clienteNome}${tipo ? ' · ' + (tipo==='cotacao'?'Cotações':'Faturas') : ''}`;
    
  const wrap = document.getElementById('resultado-cliente');
  if (!docs.length) {
    wrap.innerHTML = `<div class="resultado-vazio">Nenhum documento para este cliente.</div>`;
    return;
  }
  
  wrap.innerHTML = `
    <div style="margin-bottom:1rem;">
      <div style="font-family:'Bebas Neue';font-size:22px;letter-spacing:2px;color:var(--white);">${clienteNome}</div>
    </div>
    <div class="kpi-mini-grid" style="margin-bottom:1.5rem;">
      <div class="kpi-mini">
        <div class="kpi-mini-val">${docs.length}</div>
        <div class="kpi-mini-label">Total Documentos</div>
      </div>
      <div class="kpi-mini">
        <div class="kpi-mini-val">${totalCot}</div>
        <div class="kpi-mini-label">Cotações</div>
      </div>
      <div class="kpi-mini">
        <div class="kpi-mini-val">${totalFat}</div>
        <div class="kpi-mini-label">Faturas</div>
      </div>
      <div class="kpi-mini">
        <div class="kpi-mini-val" style="font-size:20px;">${fmtNum(totalMZN)}</div>
        <div class="kpi-mini-label">Total MZN</div>
      </div>
    </div>
    <div class="card">
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Nº</th><th>Tipo</th><th>Data</th><th>Assunto</th>
            <th>Serviço</th><th>Total</th><th>Elaborado por</th>
          </tr></thead>
          <tbody>
            ${docs.map(d=>`<tr>
              <td style="font-family:'Courier Prime';color:var(--amber);font-weight:700;">${d.numero||'—'}</td>
              <td><span class="badge badge-${d.tipo}">${d.tipo==='cotacao'?'Cotação':'Fatura'}</span></td>
              <td style="color:var(--steel);font-size:13px;">${fmtData(d.data)}</td>
              <td style="font-size:13px;color:var(--steel);max-width:200px;">${d.assunto ? d.assunto.substring(0,60)+(d.assunto.length>60?'...':'') : '—'}</td>
              <td><span class="badge badge-${d.servico||'mao'}" style="font-size:10px;">${d.servico==='mao'?'Mão-de-Obra':d.servico==='material'?'Material':'Misto'}</span></td>
              <td style="font-family:'Courier Prime';">${fmtNum(d.total)} ${d.moeda}</td>
              <td style="font-size:13px;color:var(--steel);">${d.utilizador_nome||'—'}</td>
            </tr>`).join('')}
          </tbody>
          <tfoot>
            <tr style="border-top:2px solid var(--border);">
              <td colspan="5" style="font-weight:700;padding:12px;">TOTAL CLIENTE</td>
              <td style="font-family:'Courier Prime';font-weight:700;color:var(--amber);font-size:15px;">${fmtNum(totalMZN)} MZN</td>
              <td></td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>`;
}

// ── RELATÓRIO 3: UTILIZADOR ───────────────────────────
function gerarUtilizador() {
  const de  = document.getElementById('util-de').value;
  const ate = document.getElementById('util-ate').value;
  
  if (!de || !ate) { alert('Selecciona o período.'); return; }
  
  let docs = documentos.filter(d => d.data >= de && d.data <= ate);
  document.getElementById('print-titulo-utilizador').textContent = 
    `Actividade por Utilizador — ${fmtData(de)} a ${fmtData(ate)}`;
    
  const wrap = document.getElementById('resultado-utilizador');
  if (!docs.length) {
    wrap.innerHTML = `<div class="resultado-vazio">Nenhum documento neste período.</div>`;
    return;
  }
  
  // Agrupar por utilizador
  const porUtil = {};
  docs.forEach(d => {
    const nome = d.utilizador_nome || 'Desconhecido';
    if (!porUtil[nome]) porUtil[nome] = { nome, cargo: d.utilizador_cargo||'', docs:[], totalMZN:0 };
    porUtil[nome].docs.push(d);
    porUtil[nome].totalMZN += d.total_mzn || 0;
  });
  
  const utils = Object.values(porUtil).
